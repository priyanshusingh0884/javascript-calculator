<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display" >
            <input id="input" type="text" placeholder="0">
        </div>
        
        <div class="buttons">
            <button class="btn clear" type="button">C</button>
            <button class="btn backspace" type="button">X</button>
            <button class="btn percentage" type="button">%</button>
            <button class="btn divide operator" type="button">/</button>
            <button class="btn seven number" type="button">7</button>
            <button class="btn eight number" type="button">8</button>
            <button class="btn nine number" type="button">9</button>
            <button class="btn multiply operator" type="button">x</button>
            <button class="btn four number" type="button">4</button>
            <button class="btn five number" type="button">5</button>
            <button class="btn six number" type="button">6</button>
            <button class="btn subtract operator" type="button">-</button>
            <button class="btn one number" type="button">1</button>
            <button class="btn two number" type="button">2</button>
            <button class="btn three number" type="button">3</button>
            <button class="btn add operator" type="button">+</button>
            <button class="btn zero number" type="button">0</button>
            <button class="btn point number" type="button">.</button>
            <button class="btn equal" type="button">=</button>
            
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
